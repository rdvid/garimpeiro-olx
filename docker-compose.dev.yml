services:
  install:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build -w @garimpeiro/core"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

  api:
    image: node:22-alpine
    working_dir: /app
    command: npx tsx watch apps/api/src/server.ts
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '3000:3000'
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      GARIMPEIRO_GUI_ORIGIN: http://localhost:5173
    depends_on:
      install:
        condition: service_completed_successfully
    restart: unless-stopped

  gui:
    image: node:22-alpine
    working_dir: /app
    command: npm run dev -w gui -- --host 0.0.0.0 --port 5173
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    depends_on:
      install:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  node_modules:
